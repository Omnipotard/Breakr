<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BREAKR Emulator</title>
<meta property="og:image" content="../docs/img/card.png">
<meta name="description" content="BREAKR by Omnipotard: a breakbeat slicer firmware for the M-VAVE FM-1, running in the browser.">
<meta name="theme-color" content="#07080b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307080b'/%3E%3Cpath d='M4 6h24v8H4z' fill='%23e8ff2e'/%3E%3Cpath d='M8 16h20v4H8z' fill='%23e8ff2e'/%3E%3Cpath d='M4 22h24v4H4z' fill='%23e8ff2e'/%3E%3Ccircle cx='10' cy='25' r='2.4' fill='%23FF5454'/%3E%3Ccircle cx='16' cy='25' r='2.4' fill='%23FFCE3C'/%3E%3Ccircle cx='22' cy='25' r='2.4' fill='%2350DC78'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;600&family=Silkscreen&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* BREAKR's look, shared with the site: a rack's panel at night. Ink black, one signal colour (acid yellow,
   or the theme the FM-1 shows), a second one for what is armed (signal red); boxes with two corners cut
   like tape labels; Barlow Condensed for what is read, Silkscreen for the small marks under the controls. */
:root {
  --ink: #07080b;
  --ink-2: #0f1117;
  --ink-3: #171a22;
  --panel: #1d2029;
  --panel-hi: #2a2e3a;
  --rule: #323746;
  --paper: #f2f3f5;
  --text-2: #c9cdd6;
  --muted: #8c93a3;
  --sig: #e8ff2e;
  --sig-ink: #0b0c08;
  --arm: #ff4030;
  --hot: var(--sig);
  --k1: #FF5454;
  --k2: #FFCE3C;
  --k3: #50DC78;
  --k4: #4696FF;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --text: "Barlow", "Segoe UI", system-ui, sans-serif;
  --pixel: "Silkscreen", "Courier New", monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --cut: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  --cut-s: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--ink); color: var(--paper); }
body {
  margin: 0; font-family: var(--text); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 48px; overflow-x: hidden;
  background:
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 48px 48px,
    var(--ink);
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
a { color: var(--sig); }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--sig); outline-offset: 2px; }

/* ---- the header: the chopped name */
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px 20px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: end; gap: 14px; flex-wrap: wrap; }
.logo { position: relative; font-family: var(--display); font-weight: 800; font-size: clamp(44px, 9vw, 76px); line-height: .82; letter-spacing: .01em; color: var(--sig); margin: 0; }
.logo .cut { position: absolute; inset: 0; color: var(--sig); clip-path: inset(41% 0 39% 0); transform: translateX(.09em); }
.logo .base { clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%, 0 62%, 100% 62%, 100% 100%, 0 100%); display: block; }
.beta { font-family: var(--pixel); font-size: 11px; letter-spacing: .06em; color: var(--sig-ink); background: var(--arm); padding: 4px 8px 3px; clip-path: var(--cut-s); white-space: nowrap; margin-bottom: 6px; }
.sitenav { display: flex; gap: 4px 16px; flex-wrap: wrap; margin-bottom: 8px; }
.sitenav a { font-family: var(--pixel); font-size: 11px; color: var(--text-2); text-decoration: none; }
.sitenav a:hover { color: var(--sig); }
.tag { font-family: var(--pixel); font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-bottom: 6px; }
.langs { display: flex; gap: 2px; background: var(--ink-3); padding: 3px; clip-path: var(--cut-s); margin-bottom: 4px; }
.langs button { appearance: none; border: 0; background: none; color: var(--muted); font-family: var(--pixel); font-size: 12px; padding: 5px 10px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--sig); color: var(--sig-ink); }
.note { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 12px 16px; color: var(--text-2); font-size: 15px;
  background: repeating-linear-gradient(135deg, rgba(255,64,48,.10) 0 6px, transparent 6px 12px), var(--ink-2); border-left: 3px solid var(--arm); }
.note svg { flex: none; width: 20px; height: 20px; color: var(--arm); margin-top: 2px; }
.note b { color: var(--paper); }

/* ---- the device */
.device {
  position: relative;
  background: linear-gradient(175deg, #2b2d33, #1f2127 45%, #18191e);
  padding: 26px 26px 22px;
  clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
  display: grid; grid-template-columns: 240px minmax(0, 1fr) 330px; grid-template-areas: "left screen right" "keys keys keys";
  gap: 22px 26px; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.device::before { content: "BREAKR // FM-1"; position: absolute; top: 8px; right: 26px; font-family: var(--pixel); font-size: 10px; color: rgba(255,255,255,.22); letter-spacing: .08em; }
.zone-left { grid-area: left; display: flex; flex-direction: column; gap: 16px; }
.zone-screen { grid-area: screen; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
.zone-right { grid-area: right; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.zone-keys { grid-area: keys; }
.knobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
.knobs.row { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 6px; }
.knob { --ring: #4b4d58; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: ns-resize; touch-action: none; min-width: 0; }
.knob .lbl { font-family: var(--pixel); font-size: 10px; letter-spacing: .04em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
.knob .fn { font-family: var(--pixel); font-size: 9.5px; color: var(--sig); letter-spacing: .02em; min-height: 1.3em; text-align: center; line-height: 1.3; }
.knob .fn.live { color: var(--ring); min-height: 2.6em; max-width: 100%; white-space: pre-line; overflow-wrap: anywhere; }
.ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; border: 3px solid var(--ring); transition: box-shadow .15s; }
.knob.col .ring { box-shadow: 0 0 12px -5px var(--ring); }
.knob.col .lbl { color: var(--ring); }
.knob.hot .ring { box-shadow: 0 0 20px 0 var(--ring); }
.cap {
  --a: 0deg; width: 54px; height: 54px; border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #55575f 0 44%, transparent 45%), repeating-conic-gradient(from 0deg, #1e1f24 0 6deg, #34353c 6deg 12deg);
  box-shadow: 0 6px 10px rgba(0,0,0,.6), inset 0 2px 2px rgba(255,255,255,.1);
  position: relative; transform: rotate(var(--a)); transition: transform .06s linear;
}
.cap::after { content: ""; position: absolute; left: 50%; top: 7px; width: 3px; height: 13px; margin-left: -1.5px; background: var(--paper); }
.knob:focus-visible { outline: none; }
.knob:focus-visible .ring { outline: 2px solid var(--sig); outline-offset: 3px; }
.btn:focus-visible, .key:focus-visible { outline: 2px solid var(--sig); outline-offset: 3px; }

.btns { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px 8px; align-items: start; }
.oct { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.btn { appearance: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0; background: none; font: inherit; min-width: 0; color: var(--text-2); }
.btn .face {
  width: 100%; height: 30px; background: linear-gradient(180deg, #2c2e35, #202228); clip-path: var(--cut-s);
  display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .06em; color: var(--text-2);
  transition: transform .04s, background .12s, color .12s;
}
.btn .fn { font-family: var(--pixel); font-size: 9px; color: var(--sig); text-align: center; line-height: 1.25; margin-top: 2px; min-height: 1.25em; }
.btn .alt { font-family: var(--pixel); font-size: 8px; color: var(--muted); text-align: center; line-height: 1.2; }
.btn .sfn { display: none; font-family: var(--pixel); font-size: 9px; color: var(--arm); text-align: center; line-height: 1.25; margin-top: 2px; min-height: 1.25em; }
.shift .btn .sfn { display: block; }
.shift .btn:has(.sfn) .fn, .shift .btn:has(.sfn) .alt { display: none; }
.btn.on .face { background: var(--glow, var(--hot)); color: var(--sig-ink); }
.btn.dim .face { color: var(--paper); background: linear-gradient(180deg, #33363f, #26282f); }
.btn.down .face { transform: translateY(2px); filter: brightness(1.2); }
.btn[data-id="12"] { --glow: #60ff96; }
.btn[data-id="13"] { --glow: var(--arm); }

.bezel { background: #000; padding: 14px; width: min(100%, 392px); position: relative; clip-path: var(--cut); box-shadow: inset 0 0 0 1px #2a2c33; }
.glass { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; overflow: hidden; background: #07080b; }
.glass canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,.05), transparent 40%), repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px); }
.power { position: absolute; inset: 14px; display: grid; place-items: center; align-content: center; gap: 14px; text-align: center; padding: 18px;
  background: repeating-linear-gradient(135deg, rgba(232,255,46,.05) 0 6px, transparent 6px 12px), #07080b; }
.power p { margin: 0; color: var(--text-2); font-size: 15px; max-width: 26ch; }
.power button { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .08em; color: var(--sig-ink); background: var(--sig); border: 0; padding: 12px 24px; cursor: pointer; clip-path: var(--cut-s); }
.power button:active { transform: translateY(2px); }
.power button:disabled { opacity: .7; cursor: progress; }
.power .err { color: var(--arm); font-size: 14px; }
.scrinfo { width: min(100%, 392px); display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--pixel); font-size: 11px; color: var(--muted); min-height: 24px; }
.scrinfo .pg { --acc: var(--sig); color: var(--sig-ink); background: var(--acc); padding: 3px 10px; clip-path: var(--cut-s); white-space: nowrap; }
.scrinfo .pg:empty { visibility: hidden; }
.scrinfo .trk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }

/* the keybed: 16 white keys, 11 black, F3 to G5; what they do written over it */
.keycap { display: flex; justify-content: space-between; gap: 10px; font-family: var(--pixel); font-size: 10px; color: var(--muted); margin: 0 4px 6px; }
.keycap b { color: var(--sig); font-weight: 400; }
.keybed { position: relative; height: 150px; background: #121317; padding: 10px; box-shadow: inset 0 2px 8px rgba(0,0,0,.7); clip-path: var(--cut); }
.keys { position: relative; height: 100%; }
.key { position: absolute; bottom: 0; cursor: pointer; touch-action: none; display: flex; justify-content: center; }
.key.w { top: 52px; background: linear-gradient(180deg, #35373f, #2a2c33); clip-path: var(--cut-s); }
.key.b { top: 0; height: 64px; background: linear-gradient(180deg, #2a2b31, #1f2025); z-index: 2; clip-path: var(--cut-s); }
.key::before { content: ""; position: absolute; top: 12px; width: 4px; height: 34%; background: #2b2d34; transition: background .08s, box-shadow .08s; }
.key.w::before { top: 18px; }
.key.dim::before { background: color-mix(in srgb, var(--hot) 35%, #2b2d34); }
.key.on::before { background: var(--hot); box-shadow: 0 0 10px var(--hot); }
.key.down { filter: brightness(1.3); transform: translateY(2px); }
.key .kn { position: absolute; bottom: 6px; font-family: var(--pixel); font-size: 9px; color: var(--muted); }

/* ---- panels */
.panel { background: var(--ink-2); padding: 20px 22px; min-width: 0; clip-path: var(--cut); border-top: 2px solid var(--rule); }
.panel h2, .guide h2 { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .03em; margin: 0 0 8px; text-transform: uppercase; line-height: 1; }
.panel p { margin: 0 0 8px; color: var(--text-2); font-size: 15.5px; max-width: 70ch; }
.panel p b { color: var(--paper); }
.breaks h2 { color: var(--sig); }
.slots { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.slot { background: var(--ink-3); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; clip-path: var(--cut-s); }
.slot .shead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slot .sid { font-family: var(--pixel); font-size: 10px; color: var(--sig); }
.slot .smeta { font-family: var(--pixel); font-size: 9px; color: var(--muted); white-space: nowrap; }
.slot .sname { font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .02em; color: var(--paper); overflow-wrap: anywhere; min-height: 1.3em; line-height: 1.2; }
.slot.empty .sname { color: var(--muted); font-weight: 600; }
.slot .scls { display: flex; gap: 2px; height: 4px; overflow: hidden; background: #0b0c10; }
.slot .scls i { flex: 1; }
.sbtn { appearance: none; border: 0; cursor: pointer; font: 700 15px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--paper); background: var(--panel-hi); padding: 10px 16px; text-align: center; display: inline-block; clip-path: var(--cut-s); text-decoration: none; transition: background .12s; }
.sbtn:hover { background: #3a3f4f; }
.sbtn.hot { background: var(--sig); color: var(--sig-ink); }
.sbtn.hot:hover { filter: brightness(1.06); }
.sbtn:disabled { opacity: .45; cursor: default; }
label.sbtn:focus-within { outline: 2px solid var(--sig); outline-offset: 2px; }
.bacts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.pmsg { font-family: var(--pixel); font-size: 11px; color: var(--muted); margin: 10px 0 0; }
.pmsg:empty { display: none; }
.pmsg.err { color: var(--arm); }
.pmsg.ok { color: #60ff96; }
.projects h2 { color: var(--paper); }
.proj { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: space-between; }
.proj > div:first-child { flex: 1 1 380px; min-width: 0; }
.proj .acts { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---- the guide */
.guide { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.guide section { background: var(--ink-2); padding: 18px 20px; min-width: 0; clip-path: var(--cut); border-top: 2px solid var(--sig); }
.guide section:nth-child(2) { border-top-color: var(--arm); }
.guide section:nth-child(3) { border-top-color: var(--k4); }
.guide h2 { font-size: 22px; }
.guide li { color: var(--text-2); font-size: 15px; }
.guide ul { margin: 0; padding-left: 18px; display: grid; gap: 7px; }
.guide b { color: var(--paper); }
kbd { font-family: var(--mono); font-size: 12px; background: var(--panel); padding: 1px 6px; color: var(--paper); white-space: nowrap; }

/* ---- a word from the author */
.donate { padding: 22px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 28px; clip-path: var(--cut);
  background: repeating-linear-gradient(135deg, rgba(232,255,46,.06) 0 8px, transparent 8px 16px), var(--ink-2); }
.donate > div { flex: 1 1 320px; min-width: 0; }
.donate h2 { font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; margin: 0 0 6px; color: var(--sig); line-height: 1; }
.donate p { margin: 0; color: var(--text-2); font-size: 16px; max-width: 56ch; }
.donate .sig { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.kofi { display: inline-flex; align-items: center; gap: 10px; background: var(--sig); color: var(--sig-ink); font: 800 18px/1.2 var(--display); letter-spacing: .05em; text-transform: uppercase; text-decoration: none; padding: 13px 22px; clip-path: var(--cut-s); }
.kofi:hover { filter: brightness(1.07); }
.kofi:focus-visible { outline: 2px solid var(--paper); outline-offset: 4px; }
.kofi svg { width: 24px; height: 24px; flex: none; }
.foot { color: var(--muted); font-size: 13.5px; max-width: 86ch; margin: 0; }
.foot a { color: var(--text-2); }

@media (max-width: 940px) {
  .device { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "screen screen" "right right" "left left" "keys keys"; padding: 18px; }
  .zone-left { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: end; gap: 14px; }
  .zone-left .knobs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .guide { grid-template-columns: minmax(0, 1fr); }
  .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  .device { padding: 14px; gap: 16px; }
  .ring { width: 52px; height: 52px; }
  .cap { width: 42px; height: 42px; }
  .cap::after { top: 5px; height: 10px; }
  .btns { gap: 8px 5px; }
  .btn .face { font-size: 12px; height: 28px; }
  .btn .fn, .btn .alt, .btn .sfn { font-size: 7.5px; }
  .zone-left { grid-template-columns: minmax(0, 1fr); }
  .keybed { height: 128px; padding: 6px; }
  .key.w { top: 44px; }
  .key.b { height: 54px; }
  .key .kn { display: none; }
  .panel, .guide section { padding: 16px; }
  .donate { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { .cap, .btn .face, .key::before, .ring, .sbtn { transition: none; } }
</style>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 class="logo" aria-label="BREAKR"><span class="base" aria-hidden="true">BREAKR</span><span class="cut" aria-hidden="true">BREAKR</span></h1>
      <span class="beta" id="beta-badge">0.3 BETA</span>
    </div>
    <nav class="sitenav" aria-label="Site"><a href="../index.html">HOME</a><a href="../installer.html" data-t="n.inst"></a><a href="../editor/index.html" data-t="n.edit"></a><a href="../manual.html" data-t="n.man"></a></nav>
    <div class="langs" role="group" data-ta="langs" aria-label="Language">
      <button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="fr" lang="fr">FR</button>
    </div>
  </header>

  <p class="note" role="note">
    <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 10v4.5"/><path d="M12 17.4v.1"/></svg>
    <span data-t="beta"></span>
  </p>

  <div class="device" id="device" data-page="-1">
    <div class="zone-left">
      <div class="knobs" id="knobs-left"></div>
      <div class="oct" id="oct"></div>
    </div>
    <div class="zone-screen">
      <div class="bezel">
        <div class="glass"><canvas id="screen" width="240" height="240" role="img" data-ta="screen" aria-label="The FM-1's screen"></canvas></div>
        <div class="power" id="power">
          <p data-t="power"></p>
          <button id="power-btn" type="button" data-t="powerBtn"></button>
          <div class="err" id="power-err" role="alert" hidden></div>
        </div>
      </div>
      <div class="scrinfo" aria-live="polite"><span class="pg" id="pg-name"></span><span class="trk" id="brk-name"></span></div>
    </div>
    <div class="zone-right">
      <div class="knobs row" id="knobs-right"></div>
      <div class="btns" id="btns"></div>
    </div>
    <div class="zone-keys"><div class="keycap"><span>WHITE <b id="hint-white"></b></span><span>BLACK <b id="hint-black"></b></span></div><div class="keybed"><div class="keys" id="keys"></div></div></div>
  </div>

  <section class="panel breaks" id="breaks" aria-labelledby="brk-h">
    <h2 id="brk-h" data-t="b.h"></h2>
    <p data-t="b.how"></p>
    <ol class="slots eight" id="slots"></ol>
    <p class="pmsg" id="bank-msg" role="status"></p>

  const BRK_SRC = "/* SPDX-License-Identifier: GPL-3.0-only */\n/* BREAKR's web library (the editor and the emulator share it): audio in, slices, 4-bit IMA ADPCM, the bank\n * of breaks, and the upload over SysEx, to an FM-1 (Web MIDI) or to the emulator. The same formats as the\n * firmware: firmware/src/brk_ima.c, brk_store.c, brk_sysex.c. Plain JavaScript, no build step. */\n(function (root) {\n  \"use strict\";\n  const BRK = {};\n\n  /* ---- 4-bit IMA ADPCM, blocks of 256 bytes = 505 samples (brk_ima.c) */\n  const STEP = [7, 8, 9, 10, 11, 12, 13, 14, 16, 17, 19, 21, 23, 25, 28, 31, 34, 37, 41, 45, 50, 55, 60, 66, 73, 80, 88, 97,\n    107, 118, 130, 143, 157, 173, 190, 209, 230, 253, 279, 307, 337, 371, 408, 449, 494, 544, 598, 658, 724, 796,\n    876, 963, 1060, 1166, 1282, 1411, 1552, 1707, 1878, 2066, 2272, 2499, 2749, 3024, 3327, 3660, 4026, 4428, 4871,\n    5358, 5894, 6484, 7132, 7845, 8630, 9493, 10442, 11487, 12635, 13899, 15289, 16818, 18500, 20350, 22385, 24623,\n    27086, 29794, 32767];\n  const IDX = [-1, -1, -1, -1, 2, 4, 6, 8];\n  const SPB = 505, BLOCK = 256;\n  function qn(pred, idx, s) {\n    let d = s - pred, step = STEP[idx], nib = 0;\n    if (d < 0) { nib = 8; d = -d; }\n    if (d >= step) { nib |= 4; d -= step; }\n    if (d >= step >> 1) { nib |= 2; d -= step >> 1; }\n    if (d >= step >> 2) nib |= 1;\n    return nib;\n  }\n  function ap(st, nib) {                         /* st = [pred, idx] */\n    const step = STEP[st[1]];\n    let diff = step >> 3;\n    if (nib & 4) diff += step;\n    if (nib & 2) diff += step >> 1;\n    if (nib & 1) diff += step >> 2;\n    let p = st[0] + ((nib & 8) ? -diff : diff);\n    st[0] = p > 32767 ? 32767 : p < -32768 ? -32768 : p;\n    let i = st[1] + IDX[nib & 7];\n    st[1] = i < 0 ? 0 : i > 88 ? 88 : i;\n  }\n  BRK.imaBytes = (frames) => Math.ceil(frames / SPB) * BLOCK;\n  /* each nibble the best of 16 over it and the next `look` samples (+1.5 dB on drums; the decoder is standard) */\n  BRK.imaEncode = func   }\n    return best;\n  };\n\n  /* ---- slices: an STFT (1024, hop 128), the spectral flux in three bands; peaks over a moving mean; each\n   * onset found again to the sample. The class from what rose: lows (kick), mids and highs (snare), highs (hat) */\n  function fft(re, im) {\n    const n = re.length;\n    for (let i = 1, j = 0; i < n; i++) {\n      let bit = n >> 1;\n      for (; j & bit; bit >>= 1) j ^= bit;\n      j ^= bit;\n      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }\n    }\n    for (let len = 2; len <= n; len <<= 1) {\n      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);\n      for (let i = 0; i < n; i += len) {\n        let cr = 1, ci = 0;\n        for (let k = 0; k < len / 2; k++) {\n          const a = i + k, b = a + len / 2, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;\n          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;\n          const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;\n        }\n      }\n    }\n  }\n  BRK.analyse = function (pcm, rate) {           /* pcm: Float32Array or Int16Array */\n    const N = 1024, H = 128, nf = Math.max(1, Math.floor((pcm.length - N) / H) + 1);\n    const scale = pcm instanceof Int16Array ? 1 / 32768 : 1;\n    const win = new Float32Array(N);\n    for (let i = 0; i < N; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / N);\n    const bin = (f) => Math.max(1, Math.min(N / 2 - 1, Math.round(f * N / rate)));\n    const b150 = bin(150), b300 = bin(300), b2k = bin(2000), b5k = bin(5000);\n    const lo = new Float32Array(nf), mid = new Float32Array(nf), hi = new Float32Array(nf), flux = new Float32Array(nf), en = new Float32Array(nf);\n    let prev = new Float32Array(N / 2);\n    const re = new Float32Array(N), im = new Float32Array(N);\n    for (let f = 0; f < nf; f++) {\n      const o = f * H;\n      for (let i = 0; i < N; i++) { re[i] = (pcm[o + i] || 0) * scale * win[i]; im[i] = 0; }\n      ff       if (audio.audioWorklet && window.AudioWorkletNode) {
        try {
          const url = URL.createObjectURL(new Blob([WORKLET_SRC], {type: "application/javascript"}));
          await audio.audioWorklet.addModule(url);
          const node = new AudioWorkletNode(audio, "breakr", {numberOfInputs: 0, outputChannelCount: [2], processorOptions: {bytes: wasm, boot: bootData()}});
          node.port.onmessage = (ev) => onEngine(ev.data);
          node.onprocessorerror = (ev) => { console.error("BREAKR engine stopped", ev); err.hidden = false; err.textContent = T("err"); $("power").hidden = false; };
          node.connect(audio.destination);
          send = (m) => node.port.postMessage(m);
          ok = true;
        } catch (e) { console.warn("worklet:", e); }
      }
      if (!ok) mainThreadEngine(wasm);
      running = true;
      device.dataset.running = "1";
      send({t: "master", v: Math.round(master * master * 6000)});
      send({t: "lang", v: LANG_ID[lang]});
      $("power").hidden = true;
      audio.resume().catch(() => {});
      const pend = ls.get(LS_PENDING);
      if (pend) { ls.del(LS_PENDING); try { send({t: "bank", data: b64dec(pend)}); } catch (e) {} }
      if (navigator.requestMIDIAccess) {          /* a MIDI keyboard plays the slices */
        navigator.requestMIDIAccess().then((m) => {
          const hook = (i) => { i.onmidimessage = (ev) => { const [st, d1, d2] = ev.data; if (st >= 0x80 && st < 0xA0) send({t: "midi", st, d1, d2: d2 || 0}); }; };
          m.inputs.forEach(hook);
          m.onstatechange = (ev) => { if (ev.port.type === "input" && ev.port.state === "connected") hook(ev.port); };
        }).catch(() => {});
      }
    } catch (e) {
      btn.disabled = false;
      err.hidden = false;
      err.textContent = T("err");
      console.error(e);
    }
  }
  $("power-btn").addEventListener("click", powerOn);
  if (ls.get(LS_PENDING)) bankMsg(T("b.off"));

  ctx2d.fillStyle = "#0a0b0e";
  ctx2d.fillRect(0, 0, 240, 240);
})();
</script>
